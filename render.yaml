# How the API is deployed, as a file rather than as a memory of dashboard clicks.
#
# Render reads this when the repo is connected as a Blueprint. Everything here
# is reproducible; the four secrets are deliberately not, and are marked
# sync:false so Render asks for them once and never stores them in git.
#
#   1. Neon: create a project, copy the pooled connection string
#   2. Render: New > Blueprint > this repository
#   3. Fill in the four values it asks for
#
# The service URL Render assigns is stable, which is the whole point of moving:
# no more tunnel hostname changing every restart, no watchdog, no publishing a
# new address to the client on every reboot.

services:
  - type: web
    name: omextv-api
    runtime: docker
    plan: free
    region: singapore # closest Render region to India
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    # Only rebuild when the API changes. The client deploys separately on
    # Vercel, and a CSS tweak should not restart the socket server underneath
    # everyone who is mid-call.
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: NODE_ENV
        value: production

      # --- Secrets: entered once in Render, never in git -------------------
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: JWT_SECRET
        sync: false # 32+ random characters; changing it signs everyone out
      - key: UPI_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false

      # --- Where the browser is ---------------------------------------------
      - key: CLIENT_URL
        value: https://omextv.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://omextv.vercel.app

      # --- Single instance ---------------------------------------------------
      # No REDIS_URL on purpose. The store falls back to memory, which is
      # correct for one instance and wrong for several: two instances each keep
      # their own queue, and a user on one can never be matched with a user on
      # the other. Add Redis at the same time as a second instance, not before.

      - key: PAYMENT_PROVIDER
        value: upi

      # --- Inference ---------------------------------------------------------
      # The free plan has 512 MB of RAM and the weights are ~26 MB, which fits
      # but not with much room. If the service restarts on its own soon after
      # boot, this is the first thing to set to "mock".
      - key: GENDER_PROVIDER
        value: onnx

      - key: STUN_URLS
        value: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302

      # --- TURN --------------------------------------------------------------
      # Still empty, and still the reason two people on different networks
      # cannot see each other. Nothing about moving off the laptop changes it.
      - key: TURN_SERVER_URL
        sync: false
      - key: TURN_SERVER_USERNAME
        sync: false
      - key: TURN_SERVER_CREDENTIAL
        sync: false
